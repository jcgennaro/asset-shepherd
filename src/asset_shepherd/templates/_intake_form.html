<section class="intake-card" aria-labelledby="intake-title" data-focus-area="upload">
  <h2 id="intake-title">Upload one GLB</h2>

  {% if error %}
    <div class="alert danger" role="alert">
      <strong>Intake stopped</strong>
      <span>{{ error }}</span>
    </div>
  {% endif %}

  <form action="{{ url_for('create_story_job', story_slug=story.slug) }}" method="post" enctype="multipart/form-data" class="intake-form" data-busy-form>
    <label class="field-label" for="profile_id">Project target</label>
    <div class="select-wrap">
      <select id="profile_id" name="profile_id" required>
        {% for profile in profiles %}
          <option value="{{ profile.profile_id }}">
            {{ profile.name }} — {{ profile.description }}
          </option>
        {% endfor %}
      </select>
    </div>

    <label class="drop-zone" for="asset">
      <input id="asset" name="asset" type="file" accept=".glb,model/gltf-binary" required data-file-input>
      <strong data-file-label>Choose an untouched GLB</strong>
      <span>Static mesh · up to {{ max_upload_mb }} MB</span>
    </label>

    <button class="primary-button" type="submit" data-submit-button>
      <span>{{ story.submit_label }}</span>
      <span aria-hidden="true">→</span>
    </button>
  </form>

  <p class="fine-print">Your original stays untouched. Local mode makes no model or network request.</p>
</section>
