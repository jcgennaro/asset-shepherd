{% extends "base.html" %}
{% block content %}
  <section class="conversation-start" data-focus-area="start conversation" aria-labelledby="conversation-title">
    <header class="intent-heading">
      <h2 id="conversation-title">Describe your model, how it will be used, and its intended scale.</h2>
    </header>

    {% if error %}
      <div class="alert danger" role="alert"><strong>Workspace not started</strong><span>{{ error }}</span></div>
    {% endif %}

    <form action="{{ url_for('create_hosted_workspace') }}" method="post" enctype="multipart/form-data" class="conversation-start-form" data-busy-form>
      <label>
        <span>Model description</span>
        <textarea name="description" minlength="12" maxlength="600" rows="4" required autofocus placeholder="A stylized lantern for a game level, about waist-high, with warm emissive panels.">{{ description }}</textarea>
      </label>
      <label class="drop-zone compact" for="hosted-asset">
        <input id="hosted-asset" name="asset" type="file" accept=".glb,model/gltf-binary" required data-file-input>
        <strong data-file-label>Choose the untouched GLB</strong>
        <span>Static GLB · up to 50 MB</span>
      </label>
      <button class="primary-button" type="submit" data-submit-button>Measure my asset <span aria-hidden="true">→</span></button>
    </form>
  </section>
{% endblock %}
