{% extends "base.html" %}
{% block content %}
  <section class="single-step" data-focus-area="GLB upload" aria-label="Upload the GLB">
    {% if error %}<div class="alert danger" role="alert">{{ error }}</div>{% endif %}
    <form action="{{ url_for('upload_hosted_asset', draft_id=draft.draft_id) }}" method="post" enctype="multipart/form-data" class="single-step-form" data-busy-form>
      <label class="drop-zone" for="hosted-asset" data-drop-zone>
        <input id="hosted-asset" name="asset" type="file" accept=".glb,model/gltf-binary" required data-file-input>
        <strong data-file-label>Choose or drop your GLB</strong>
        <span>One GLB · up to 50 MB</span>
        <span class="drop-zone-error" data-file-error aria-live="polite"></span>
      </label>
      <button class="primary-button" type="submit" data-submit-button>Shepherd this asset <span aria-hidden="true">→</span></button>
    </form>
  </section>
{% endblock %}
