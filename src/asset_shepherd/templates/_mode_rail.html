<aside class="mode-rail" aria-label="Asset Shepherd modes">
  <a class="rail-logo" href="{{ url_for('home') }}" aria-label="Asset Shepherd home">
    <span>LOGO</span>
  </a>

  <nav class="mode-nav" aria-label="Choose how Asset Shepherd explains the workflow">
    <p class="rail-group-label">Choose your style</p>
    <div class="style-tiles">
      <a
        class="mode-link style-tile mode-developer{% if active_mode == 'game-developer' %} active{% endif %}"
        href="{{ url_for('story_home', story_slug='game-developer') }}"
        aria-label="Game developer style"
        title="Game developer — check whether a GLB is ready to enter your game"
        {% if active_mode == 'game-developer' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.6 8h8.8c2.1 0 3.7 1.3 4.2 3.3l.9 3.7c.5 2.1-1.8 3.8-3.6 2.6l-2.2-1.5H8.3l-2.2 1.5c-1.8 1.2-4.1-.5-3.6-2.6l.9-3.7C3.9 9.3 5.5 8 7.6 8Z"/><path d="M7 11v4M5 13h4M16.5 12h.01M18.5 14h.01"/></svg>
        <span class="mode-label">Game developer</span>
        <span class="mode-hint" role="tooltip">Is this GLB ready for my game?</span>
      </a>
      <a
        class="mode-link style-tile mode-artist{% if active_mode == 'artist' %} active{% endif %}"
        href="{{ url_for('story_home', story_slug='artist') }}"
        aria-label="3D artist style"
        title="3D artist — see exactly what changes and what stays untouched"
        {% if active_mode == 'artist' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.4 7.7 7.6 4.4 7.6-4.4M12 12.1V21"/></svg>
        <span class="mode-label">3D artist</span>
        <span class="mode-hint" role="tooltip">What will change in my work?</span>
      </a>
      <a
        class="mode-link style-tile mode-technical{% if active_mode == 'technical-artist' %} active{% endif %}"
        href="{{ url_for('story_home', story_slug='technical-artist') }}"
        aria-label="Technical artist style"
        title="Technical artist — inspect a GLB against a versioned project policy"
        {% if active_mode == 'technical-artist' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h7M15 18h5"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="13" cy="18" r="2"/></svg>
        <span class="mode-label">Technical artist</span>
        <span class="mode-hint" role="tooltip">Does this GLB meet project policy?</span>
      </a>
    </div>

    <span class="rail-spacer" aria-hidden="true"></span>
    <span class="rail-divider" aria-hidden="true"></span>
    <p class="rail-group-label">Guidance</p>
    <div class="utility-tiles">
      <a
        class="mode-link utility-tile mode-help{% if active_mode == 'help' %} active{% endif %}"
        href="{{ url_for('home') }}"
        aria-label="Help me choose a style"
        title="Help me choose — compare the three explanations"
        {% if active_mode == 'help' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.2 2.3c-.7.3-1 .8-1 1.7M12 17h.01"/></svg>
        <span class="mode-label">Help me choose</span>
        <span class="mode-hint" role="tooltip">Help me choose the clearest style</span>
      </a>
      <a
        class="mode-link utility-tile mode-advanced{% if active_mode == 'advanced' %} active{% endif %}"
        href="{{ url_for('story_home', story_slug='advanced') }}"
        aria-label="Advanced user mode"
        title="Advanced user — go directly to supported policy controls"
        {% if active_mode == 'advanced' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
        <span class="mode-label">Advanced user</span>
        <span class="mode-hint" role="tooltip">I already know the policy I need</span>
      </a>
    </div>
  </nav>
</aside>
