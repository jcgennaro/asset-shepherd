<aside class="mode-rail" aria-label="Asset Shepherd workflow">
  <a class="rail-logo" href="{{ url_for('home') }}" aria-label="Asset Shepherd home">
    <span>LOGO</span>
  </a>

  <nav class="mode-nav intent-rail" aria-label="Intent-first workflow">
    <p class="rail-group-label">One shared workflow</p>
    <ol>
      <li class="{% if active_mode == 'describe' %}active{% endif %}"><span>1</span><strong>Describe</strong></li>
      <li class="{% if active_mode == 'confirm' %}active{% endif %}"><span>2</span><strong>Agree</strong></li>
      <li class="{% if active_mode in ['intake', 'inspect'] %}active{% endif %}"><span>3</span><strong>Inspect</strong></li>
      <li class="{% if active_mode == 'decide' %}active{% endif %}"><span>4</span><strong>Decide</strong></li>
      <li class="{% if active_mode == 'download' %}active{% endif %}"><span>5</span><strong>Download</strong></li>
    </ol>
    <a class="mode-link utility-tile" href="{{ url_for('home') }}" title="Start a new target story">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="mode-label">New asset</span>
    </a>
  </nav>
</aside>
