<div class="inspection-stream" role="log" aria-live="polite" data-inspection-stream>
  {% for check in inspection_checks %}
    <div class="inspection-check {{ check.status }}" data-inspection-check data-status="{{ check.status }}" data-label="{{ check.label }}">
      <span class="inspection-check-icon" tabindex="0" title="{{ check.detail }}" data-tooltip="{{ check.detail }}" aria-label="{{ check.label }}: {{ check.detail }}">{% if check.status == 'pass' %}✓{% elif check.status == 'blocked' %}×{% elif check.status == 'checking' %}…{% else %}!{% endif %}</span>
      <strong>{{ check.label }}</strong>
    </div>
  {% endfor %}
</div>
