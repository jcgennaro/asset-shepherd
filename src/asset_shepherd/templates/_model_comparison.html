{% set before_label = comparison_before_label|default('Before') %}
{% set ready_after_label = comparison_after_label|default('After') %}
{% set after_label = ready_after_label if comparison_candidate_ready else 'Candidate not ready' %}
<figure class="model-comparison{% if comparison_source_only %} source-only{% elif not comparison_candidate_ready %} candidate-rejected{% endif %}" data-model-comparison data-before-label="{{ before_label }}" data-after-label="{{ after_label }}">
  <header class="comparison-header{% if comparison_source_only %} source-only{% endif %}">
    {% if not comparison_source_only %}<h3>{% if comparison_candidate_ready %}{{ before_label }} and {{ ready_after_label }}{% else %}{{ before_label }} and rejected candidate{% endif %}</h3>{% endif %}
    <div class="comparison-tools" aria-label="{% if comparison_source_only %}Uploaded model{% else %}Comparison view{% endif %} controls">
      {% if comparison_source_only %}
        <button type="button" class="comparison-icon-button" data-comparison-fit="both" title="Fit model to window">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
          <span class="visually-hidden">Fit model to window</span>
        </button>
      {% else %}
        <button type="button" class="comparison-icon-button" data-comparison-cycle title="Cycle viewpoint: Both → {{ before_label }}" aria-label="Cycle viewpoint. Showing both models. Click to show {{ before_label }}.">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
          <span class="visually-hidden" data-comparison-cycle-label>Cycle viewpoint. Showing both models. Click to show {{ before_label }}.</span>
        </button>
      {% endif %}
      <button type="button" class="comparison-icon-button" data-comparison-axes aria-pressed="false" title="Show metric X, Y, and Z axes with about five major ticks per axis">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V6m0 12h13M5 18l8-8M3 8l2-2 2 2m9 8l2 2-2 2m-5-8 2-2v3"/></svg>
        <span class="visually-hidden">Metric axes</span>
      </button>
      <button type="button" class="comparison-icon-button banana-button" data-comparison-banana aria-pressed="false" title="Show a stylized, normal-size 20 cm banana for scale">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5c1.2 7.8 6 12.5 13.5 10.8-2 3.9-6.5 5.3-10 3.2C4.4 16.6 3 10.8 5 5Z"/><path d="m4.8 5 .7-2m13 12.8 1.8.7"/></svg>
        <span class="visually-hidden">Banana for scale</span>
      </button>
    </div>
  </header>

  <div class="comparison-stage">
    <model-viewer
      class="comparison-viewer"
      data-comparison-viewer
      src="{{ comparison_source_url }}"
      alt="{% if comparison_source_only %}Interactive uploaded model preview{% else %}Interactive before and after model comparison{% endif %}"
      loading="eager"
      camera-controls touch-action="pan-y" disable-tap
      interpolation-decay="240"
      auto-rotate-delay="0" rotation-per-second="4deg"
      shadow-intensity="1" environment-image="neutral" exposure="1" interaction-prompt="none">
      {% if not comparison_source_only %}
        <extra-model
          data-after-model
          src="{{ comparison_after_url }}"
          offset="{{ comparison_scene.after_offset_m|join(' ') }}">
        </extra-model>
      {% endif %}
      <extra-model
        data-banana-model
        src="{{ url_for('static', path='/banana-scale.glb') }}?v={{ static_version }}"
        offset="{{ comparison_scene.banana_offset_m|join(' ') }}"
        scale="0 0 0">
      </extra-model>
      {% for corner in comparison_scene.before.corners_m %}
        <span class="comparison-anchor" slot="hotspot-before-{{ loop.index0 }}" data-position="{{ corner|join('m ') }}m" aria-hidden="true"></span>
      {% endfor %}
      {% if not comparison_source_only %}
        {% for corner in comparison_scene.after.corners_m %}
          <span class="comparison-anchor" slot="hotspot-after-{{ loop.index0 }}" data-position="{{ corner|join('m ') }}m" aria-hidden="true"></span>
        {% endfor %}
      {% endif %}
      <span class="comparison-anchor" slot="hotspot-before-origin" data-position="0m 0m 0m" aria-hidden="true"></span>
      {% if comparison_source_only and comparison_scene.proposed_origin_m %}
        <span class="comparison-anchor" slot="hotspot-proposed-origin" data-position="{{ comparison_scene.proposed_origin_m|join('m ') }}m" aria-hidden="true"></span>
      {% endif %}
      {% if not comparison_source_only %}
        <span class="comparison-anchor" slot="hotspot-after-origin" data-position="{{ comparison_scene.after_offset_m|join('m ') }}m" aria-hidden="true"></span>
      {% endif %}
      {% for axis in comparison_scene.axes %}
        {% for tick in axis.ticks %}
          <span
            class="comparison-anchor"
            slot="{{ tick.slot_name }}"
            data-position="{{ tick.position_m|join('m ') }}m"
            data-axis-anchor="{{ axis.axis }}"
            data-axis-index="{{ loop.index0 }}"
            data-axis-label="{{ tick.label }}"
            aria-hidden="true"></span>
        {% endfor %}
      {% endfor %}
      {% for component in comparison_scene.component_boxes %}
        {% set component_index = loop.index0 %}
        {% for corner in component.corners_m %}
          <span class="comparison-anchor" slot="hotspot-component-{{ component_index }}-{{ loop.index0 }}" data-position="{{ corner|join('m ') }}m" aria-hidden="true"></span>
        {% endfor %}
      {% endfor %}
      <span class="comparison-anchor" slot="hotspot-banana" data-position="{{ comparison_scene.banana_anchor_m|join('m ') }}m" aria-hidden="true"></span>
      <div class="viewer-fallback" slot="poster">Loading preview…</div>
    </model-viewer>

    <svg class="comparison-hud" data-comparison-hud aria-hidden="true">
      <g data-comparison-target="before"></g>
      {% if not comparison_source_only %}<g data-comparison-target="after"></g>{% endif %}
      <g data-comparison-origin="before"></g>
      {% if comparison_source_only and comparison_scene.proposed_origin_m %}<g data-comparison-origin="proposed"></g>{% endif %}
      {% if not comparison_source_only %}<g data-comparison-origin="after"></g>{% endif %}
      <g data-comparison-axis-layer hidden></g>
      <g data-comparison-banana-layer hidden></g>
      <g data-comparison-component-layer></g>
    </svg>
    <p class="comparison-status" data-comparison-status role="status">Loading preview…</p>
  </div>
  <figcaption>Drag to rotate · right-drag to pan · scroll to zoom</figcaption>
  <script type="application/json" data-comparison-config>{{ comparison_scene.client_data|tojson }}</script>
</figure>
