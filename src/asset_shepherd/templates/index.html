{% extends "base.html" %}
{% block content %}
  <section class="chooser-panel" data-focus-area="style chooser" aria-labelledby="choose-title">
    <h2 id="choose-title">Which best describes you?</h2>

    {% if error %}
      <div class="alert danger" role="alert">
        <strong>That mode is unavailable</strong>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <nav class="style-choices" aria-label="Choose an Asset Shepherd style">
      <a href="{{ url_for('story_home', story_slug='game-developer') }}" title="Is this asset ready for my game?">
        <span class="choice-icon" aria-hidden="true">01</span>
        <strong>Game developer</strong>
        <b aria-hidden="true">→</b>
      </a>
      <a href="{{ url_for('story_home', story_slug='artist') }}" title="What will change in my work?">
        <span class="choice-icon" aria-hidden="true">02</span>
        <strong>3D artist</strong>
        <b aria-hidden="true">→</b>
      </a>
      <a href="{{ url_for('story_home', story_slug='technical-artist') }}" title="Does this asset meet project policy?">
        <span class="choice-icon" aria-hidden="true">03</span>
        <strong>Technical artist</strong>
        <b aria-hidden="true">→</b>
      </a>
    </nav>
  </section>
{% endblock %}
