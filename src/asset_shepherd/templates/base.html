<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Asset Shepherd -- {{ active_style }}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}?v={{ static_version }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ static_version }}">
    <script type="module" src="{{ url_for('static', path='/vendor/model-viewer.min.js') }}?v={{ static_version }}"></script>
  </head>
  <body class="mode-{{ active_mode }}">
    <div class="app-shell">
      {% include "_mode_rail.html" %}
      <section class="workspace-shell">
        <header class="workspace-header">
          <h1>Asset Shepherd -- {{ active_style }}</h1>
          {% block header_actions %}{% endblock %}
        </header>
        <main id="workspace" class="workspace-body">{% block content %}{% endblock %}</main>
      </section>
    </div>
    <script src="{{ url_for('static', path='/app.js') }}?v={{ static_version }}" defer></script>
  </body>
</html>
