<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title description">
  <title id="title">Asset Shepherd deployed AWS architecture</title>
  <desc id="description">A browser uses the live ECS Express Mode web service. The web service stores durable state in S3 and DynamoDB and sends bounded commands through SQS to a Lambda dispatcher. Lambda invokes an IAM-controlled AgentCore Runtime containing the Strands agent, deterministic GLB tools, and Chromium evidence renderer. The runtime uses Amazon Bedrock Kimi. CodeBuild and ECR publish the web and AgentCore images. A separate box lists remaining operational hardening and optional OpenAI or Meta provider support through Secrets Manager.</desc>
