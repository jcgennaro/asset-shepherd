      .service { font-size: 18px; font-weight: 700; fill: #17212b; }
      .strong { font-size: 14px; font-weight: 600; fill: #263645; }
      .copy { font-size: 14px; font-weight: 400; fill: #526170; }
      .small { font-size: 13px; font-weight: 400; fill: #526170; }
      .label { font-size: 13px; font-weight: 600; fill: #263645; }
      .badge { font-size: 11px; font-weight: 800; letter-spacing: .35px; text-anchor: middle; dominant-baseline: middle; }
      .badge-live { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
      .badge-live-text { fill: #116329; }
      .badge-next { fill: #f6f8fa; stroke: #6e7781; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .badge-next-text { fill: #57606a; }
      .line { fill: none; stroke: #304354; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-purple { fill: none; stroke: #7b42c3; stroke-width: 2.4; marker-end: url(#arrowPurple); }
      .line-blue { fill: none; stroke: #147eba; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .line-build { fill: none; stroke: #697786; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

