<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">Asset Shepherd target AWS contest deployment architecture</title>
  <desc id="description">Planned, not-yet-deployed AWS topology. A browser reaches one stateless ECS Express Mode web service with managed HTTPS ingress. The web task invokes an IAM-controlled AgentCore Runtime containing the Strands agent and deterministic GLB tools. Bedrock provides Kimi inference; S3 holds immutable artifacts and snapshots; DynamoDB coordinates conditional workflow state; ECR, IAM, and CloudWatch support deployment, identity, and observability. PrivateLink and custom VPC networking are not part of the contest deployment.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#263645"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#147eba"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7b42c3"/></marker>
    <style>
      .title { font: 700 34px Inter, "Segoe UI", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #526170; }
      .cloud-label { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; fill: #17212b; }
      .boundary-label { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; }
      .service-title { font: 700 18px Inter, "Segoe UI", Arial, sans-serif; fill: #17212b; }
      .service-copy { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #526170; }
      .service-copy-strong { font: 600 14px Inter, "Segoe UI", Arial, sans-serif; fill: #263645; }
      .icon-letter { font: 800 17px Inter, "Segoe UI", Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .connector { fill: none; stroke: #263645; stroke-width: 2.2; marker-end: url(#arrow); }
      .connector-purple { fill: none; stroke: #7b42c3; stroke-width: 2.3; marker-end: url(#arrowPurple); }
      .connector-blue { fill: none; stroke: #147eba; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrowBlue); }
      .deployment { fill: none; stroke: #697786; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .connector-label { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; fill: #263645; paint-order: stroke; stroke: white; stroke-width: 5; stroke-linejoin: round; }
      .connector-label-blue { font: 600 14px Inter, "Segoe UI", Arial, sans-serif; fill: #147eba; paint-order: stroke; stroke: white; stroke-width: 6; stroke-linejoin: round; }
      .small-note { font: 400 13px Inter, "Segoe UI", Arial, sans-serif; fill: #526170; }
      .legend { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; fill: #526170; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#f7f8fa"/>
  <text class="title" x="34" y="52">Asset Shepherd — Target AWS Contest Deployment</text>
  <text class="subtitle" x="34" y="82">Planned topology • current application remains local • no AWS resources deployed</text>
  <g transform="translate(1518 30)">
    <rect width="248" height="48" rx="24" fill="#fff3cd" stroke="#d69e00" stroke-width="1.5"/>
    <circle cx="25" cy="24" r="8" fill="#d69e00"/>
    <text x="45" y="30" font-family="Inter, Segoe UI, Arial" font-size="15" font-weight="700" fill="#704b00">TARGET • NOT YET DEPLOYED</text>
  </g>

  <!-- Planned AWS boundary -->
  <rect x="170" y="115" width="1595" height="930" rx="4" fill="#ffffff" stroke="#232f3e" stroke-width="2.5"/>
  <rect x="170" y="115" width="46" height="46" fill="#232f3e"/>
  <text x="193" y="139" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff">aws</text>
  <text class="cloud-label" x="230" y="144">AWS Cloud • target region: us-east-1</text>

  <!-- Browser outside AWS -->
  <g transform="translate(20 330)">
    <rect width="126" height="218" rx="16" fill="#ffffff" stroke="#6b7885" stroke-width="1.7" filter="url(#shadow)"/>
    <circle cx="63" cy="42" r="18" fill="none" stroke="#263645" stroke-width="3"/>
    <path d="M29 96 C32 67, 94 67, 97 96" fill="none" stroke="#263645" stroke-width="3" stroke-linecap="round"/>
    <rect x="21" y="108" width="84" height="48" rx="5" fill="none" stroke="#263645" stroke-width="3"/>
    <path d="M15 165 H111" stroke="#263645" stroke-width="3" stroke-linecap="round"/>
    <text class="service-title" x="63" y="190" text-anchor="middle">Users</text>
    <text class="service-copy" x="63" y="210" text-anchor="middle">Web browser</text>
  </g>

  <!-- ECS Express Mode -->
  <rect x="390" y="210" width="675" height="330" rx="5" fill="#fbfff9" stroke="#2e9b21" stroke-width="2"/>
  <rect x="390" y="210" width="44" height="44" fill="#2e9b21"/>
  <path d="M402 237 V224 H422 V240 H414 V245 H406 V240 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text class="boundary-label" x="448" y="239" fill="#2e7d32">Amazon ECS Express Mode</text>
  <text class="service-copy" x="448" y="263">Managed Fargate deployment for the stateless web application</text>

  <g transform="translate(500 305)" filter="url(#shadow)">
    <rect width="455" height="180" rx="10" fill="#ffffff" stroke="#ec7211" stroke-width="2"/>
    <rect x="14" y="17" width="44" height="44" rx="6" fill="#ec7211"/>
    <path d="M24 29 h24 v20 h-24z M24 36 h24 M31 29 v20" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text class="service-title" x="70" y="36">FastAPI + Jinja</text>
    <text class="service-copy-strong" x="70" y="58">Stateless web task</text>
    <path d="M16 78 H439" stroke="#e5e9ed" stroke-width="1"/>
    <text class="service-copy-strong" x="22" y="103">Managed HTTPS ingress</text>
    <text class="service-copy" x="196" y="103">Application Load Balancer • TLS • health checks</text>
    <text class="service-copy" x="22" y="128">Gallery • notebook UI • authentication • typed status</text>
    <text class="service-copy" x="22" y="151">Signs exact-object S3 transfers; returns 202 during agent work</text>
  </g>

  <!-- IAM-controlled agent runtime -->
  <rect x="390" y="630" width="675" height="300" rx="5" fill="#fdfaff" stroke="#7b42c3" stroke-width="2.2"/>
  <rect x="390" y="630" width="44" height="44" fill="#7b42c3"/>
  <circle cx="412" cy="652" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M405 653 l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text class="boundary-label" x="448" y="659" fill="#6332a5">Amazon Bedrock AgentCore Runtime • IAM-controlled</text>
  <text class="service-copy" x="448" y="682">Managed runtime • ARM64 container • /invocations and /ping</text>

  <!-- Connectors sit beneath service cards to keep the main path readable. -->
  <path class="connector" d="M146 430 H500"/>
  <text class="connector-label" x="253" y="418">HTTPS • UI, commands, status</text>

  <path class="connector-purple" d="M728 485 V630"/>
  <text class="connector-label" x="728" y="561" text-anchor="middle">IAM-authorized InvokeAgentRuntime</text>
  <path class="connector-purple" d="M680 786 H735"/>
  <text class="connector-label" x="687" y="772">typed tools</text>

  <path class="connector" d="M1065 740 H1085 V455 H1110"/>
  <path class="connector" d="M1065 775 H1110"/>
  <path class="connector" d="M1065 875 H1400 V760 H1435"/>
  <path class="connector" d="M900 485 V600 H1390 V760 H1435"/>
  <path class="connector-purple" d="M1065 675 H1080 V620 H1400 V455 H1435"/>

  <path class="deployment" d="M1110 265 H1035 V350 H955"/>
  <text class="connector-label" x="1005" y="282">container images</text>

  <path class="connector-blue" d="M83 548 C92 978 635 1010 1110 790"/>
  <text class="connector-label-blue" x="455" y="1023">Direct presigned GLB upload • candidate / evidence / package download</text>

  <g transform="translate(440 735)" filter="url(#shadow)">
    <rect width="240" height="102" rx="9" fill="#ffffff" stroke="#7b42c3" stroke-width="1.8"/>
    <rect x="14" y="18" width="44" height="44" rx="22" fill="#7b42c3"/>
    <path d="M25 43 C25 29 47 29 47 43 M28 47 H44" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text class="service-title" x="72" y="39">Strands agent</text>
    <text class="service-copy-strong" x="72" y="60">Semantic orchestrator</text>
    <text class="service-copy" x="14" y="86">Plans • interrupts • conversation</text>
  </g>

  <g transform="translate(735 710)" filter="url(#shadow)">
    <rect width="260" height="145" rx="9" fill="#ffffff" stroke="#167d93" stroke-width="1.8"/>
    <rect x="14" y="17" width="44" height="44" rx="6" fill="#167d93"/>
    <path d="M26 28 h20 v24 h-20z M30 34 h12 M30 40 h12 M30 46 h8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text class="service-title" x="72" y="38">Deterministic GLB tools</text>
    <text class="service-copy-strong" x="72" y="60">Bounded action + proof</text>
    <text class="service-copy" x="14" y="87">Inspect • mutate • hash • verify</text>
    <text class="service-copy" x="14" y="108">Exact approval/action receipts</text>
    <text class="service-copy" x="14" y="129">Headless Chromium evidence renderer</text>
  </g>

  <!-- Managed services -->
  <text class="cloud-label" x="1110" y="185">AWS managed services</text>
  <path d="M1110 195 H1715" stroke="#d7dce1" stroke-width="1.5"/>

  <g transform="translate(1110 215)" filter="url(#shadow)">
    <rect width="260" height="100" rx="9" fill="#ffffff" stroke="#ec7211" stroke-width="1.8"/>
    <rect x="14" y="18" width="44" height="44" rx="6" fill="#ec7211"/>
    <path d="M25 29 l11-6 11 6 v18 l-11 6-11-6z M25 29 l11 6 11-6 M36 35 v18" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text class="service-title" x="72" y="38">Amazon ECR</text>
    <text class="service-copy-strong" x="72" y="60">Versioned container images</text>
    <text class="service-copy" x="14" y="86">Web + AgentCore runtime</text>
  </g>

  <g transform="translate(1435 215)" filter="url(#shadow)">
    <rect width="260" height="115" rx="9" fill="#ffffff" stroke="#dd344c" stroke-width="1.8"/>
    <rect x="14" y="18" width="44" height="44" rx="22" fill="#dd344c"/>
    <path d="M36 27 a7 7 0 1 1 0 14 a7 7 0 1 1 0-14 M25 55 c2-12 20-12 22 0" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text class="service-title" x="72" y="38">AWS IAM</text>
    <text class="service-copy-strong" x="72" y="60">Least-privilege roles</text>
    <text class="service-copy" x="14" y="84">Web task + AgentCore runtime</text>
    <text class="service-copy" x="14" y="101">SigV4 service identities</text>
  </g>

  <g transform="translate(1110 400)" filter="url(#shadow)">
    <rect width="260" height="110" rx="9" fill="#ffffff" stroke="#7b42c3" stroke-width="1.8"/>
    <rect x="14" y="18" width="44" height="44" rx="22" fill="#7b42c3"/>
    <path d="M26 42 C27 28 45 28 46 42 C45 53 27 53 26 42 Z M31 37 C35 33 40 33 44 37" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text class="service-title" x="72" y="38">Amazon Bedrock</text>
    <text class="service-copy-strong" x="72" y="60">Kimi K2.5 • Converse</text>
    <text class="service-copy" x="14" y="86">Multimodal planning and review</text>
    <text class="service-copy" x="14" y="103">No direct browser access</text>
  </g>

  <g transform="translate(1435 400)" filter="url(#shadow)">
    <rect width="260" height="110" rx="9" fill="#ffffff" stroke="#b0084d" stroke-width="1.8"/>
    <rect x="14" y="18" width="44" height="44" rx="6" fill="#b0084d"/>
    <path d="M23 52 l8-10 6 4 10-16 M23 55 h26" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <text class="service-title" x="72" y="38">Amazon CloudWatch</text>
    <text class="service-copy-strong" x="72" y="60">Metrics • logs • traces</text>
    <text class="service-copy" x="14" y="86">Web + runtime correlation IDs</text>
    <text class="service-copy" x="14" y="103">No private reasoning in logs</text>
  </g>

  <g transform="translate(1110 665)" filter="url(#shadow)">
    <rect width="275" height="185" rx="9" fill="#ffffff" stroke="#3f8624" stroke-width="1.8"/>
    <rect x="14" y="18" width="44" height="44" rx="6" fill="#3f8624"/>
    <path d="M25 29 c0-7 22-7 22 0 v23 c0 7-22 7-22 0z M25 29 c0 7 22 7 22 0 M25 40 c0 7 22 7 22 0" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text class="service-title" x="72" y="38">Amazon S3</text>
    <text class="service-copy-strong" x="72" y="60">Immutable artifact store</text>
    <text class="service-copy" x="18" y="91">• Source GLBs + candidate iterations</text>
    <text class="service-copy" x="18" y="114">• Evidence renders + packages</text>
    <text class="service-copy" x="18" y="137">• Strands session snapshots</text>
    <text class="service-copy" x="18" y="160">• Hashes, versions, lifecycle policy</text>
  </g>

  <g transform="translate(1435 665)" filter="url(#shadow)">
    <rect width="260" height="185" rx="9" fill="#ffffff" stroke="#3b48cc" stroke-width="1.8"/>
    <rect x="14" y="18" width="44" height="44" rx="6" fill="#3b48cc"/>
    <path d="M24 28 h24 v25 h-24z M30 28 v25 M42 28 v25 M24 36 h24 M24 45 h24" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text class="service-title" x="72" y="38">Amazon DynamoDB</text>
    <text class="service-copy-strong" x="72" y="60">Workflow coordination</text>
    <text class="service-copy" x="18" y="91">• Workspace phase + version</text>
    <text class="service-copy" x="18" y="114">• Current iteration pointers</text>
    <text class="service-copy" x="18" y="137">• Commands + approval receipts</text>
    <text class="service-copy" x="18" y="160">• Conditional idempotent updates</text>
  </g>

  <g transform="translate(1110 890)">
    <rect width="585" height="112" rx="9" fill="#f6f8fa" stroke="#ccd3da" stroke-width="1.3"/>
    <text class="service-copy-strong" x="18" y="27">Security boundary</text>
    <text class="small-note" x="18" y="49">Browser gets an application session and exact-object presigned URLs—never AWS credentials.</text>
    <text class="small-note" x="18" y="67">AgentCore uses its IAM-authorized regional API; PrivateLink and custom VPC networking are deferred.</text>
    <line x1="18" y1="91" x2="74" y2="91" stroke="#263645" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text class="legend" x="84" y="96">runtime/control</text>
    <line x1="210" y1="91" x2="266" y2="91" stroke="#147eba" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>
    <text class="legend" x="276" y="96">presigned data</text>
    <line x1="405" y1="91" x2="461" y2="91" stroke="#697786" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <text class="legend" x="471" y="96">container deploy</text>
  </g>
</svg>
