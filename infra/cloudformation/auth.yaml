AWSTemplateFormatVersion: "2010-09-09"
Description: Invite-only Cognito access to the shared Asset Shepherd demo.

Parameters:
  EnvironmentName:
    Type: String
    Default: contest
    AllowedPattern: "[a-z0-9-]+"
  PublicOrigin:
    Type: String
    AllowedPattern: "https://[a-z0-9.-]+"

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "asset-shepherd-${EnvironmentName}"
      UserPoolTier: LITE
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "Asset Shepherd - Your invitation to the demo"
          EmailMessage: !Sub |
            <!doctype html>
            <html lang="en"><body style="margin:0;padding:24px 12px;background:#f3f6f4;color:#172a24;font-family:Arial,Helvetica,sans-serif;">
            <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d5e1db;border-radius:12px;">
              <tr><td style="padding:28px 28px 22px;background:#10241d;border-radius:12px 12px 0 0;">
                <p style="margin:0;color:#afe0ce;font-size:22px;font-weight:bold;">Asset Shepherd</p>
                <p style="margin:8px 0 0;color:#dae9e2;font-size:14px;">Inspect, repair, and prepare your 3D assets.</p>
              </td></tr>
              <tr><td style="padding:28px;line-height:1.6;font-size:15px;">
                <h1 style="margin:0 0 16px;font-size:24px;line-height:1.25;">You're invited to the demo</h1>
                <p>The Asset Shepherd team has invited you to try our 3D asset inspection and repair workflow.</p>
                <p>Sign in with the details below. You'll be asked to choose your own password before entering the app.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background:#f3f6f4;border:1px solid #d5e1db;border-radius:8px;">
                  <tr><td style="padding:16px 18px 4px;font-size:12px;color:#52665b;">SIGN-IN EMAIL</td></tr>
                  <tr><td style="padding:0 18px 16px;word-break:break-word;">{username}</td></tr>
                  <tr><td style="padding:0 18px 4px;font-size:12px;color:#52665b;">TEMPORARY PASSWORD</td></tr>
                  <tr><td style="padding:0 18px 18px;font-family:monospace;font-size:18px;word-break:break-all;">{####}</td></tr>
                </table>
                <p style="margin:26px 0;"><a href="${PublicOrigin}/workspace" style="display:inline-block;background:#afe0ce;border:1px solid #91bdad;border-radius:7px;padding:12px 20px;color:#10241d;text-decoration:none;font-weight:bold;">Open Asset Shepherd &rarr;</a></p>
                <p style="font-size:13px;color:#52665b;">This temporary password expires in 7 days. Keep it private. This is an Asset Shepherd app account, not an AWS console account.</p>
                <p style="font-size:13px;color:#52665b;">You'll be using a shared demo gallery. Please use demonstration assets, not confidential files.</p>
              </td></tr>
              <tr><td style="padding:18px 28px;border-top:1px solid #d5e1db;color:#52665b;font-size:12px;line-height:1.6;">
                Sent for Asset Shepherd through Amazon Cognito, our sign-in service. If you weren't expecting this invitation, you can ignore it.
              </td></tr>
            </table>
            </body></html>
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: asset-shepherd
        Environment: !Ref EnvironmentName
  BrowserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "asset-shepherd-${EnvironmentName}-web"
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "${PublicOrigin}/auth/callback"]
      LogoutURLs: [!Sub "${PublicOrigin}/auth/signed-out"]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
  LoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "asset-shepherd-${EnvironmentName}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1
  SessionSigningSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "asset-shepherd/${EnvironmentName}/session-signing"
      Description: Server-only session signer; not a model API key.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_key
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: asset-shepherd
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref BrowserClient
  LoginDomain:
    Value: !Sub "https://${LoginDomain}.auth.${AWS::Region}.amazoncognito.com"
  SessionSecretArn:
    Value: !Ref SessionSigningSecret
  PublicOrigin:
    Value: !Ref PublicOrigin
