<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Asset Shepherd sign-in wordmark</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 350px; height: 178px; overflow: hidden; }
  body { background: #0d1514; color: #f4efe7; text-align: center;
    font-family: "Segoe UI", Arial, sans-serif; }
  .mascot { width: 108px; height: 108px; margin: 0 auto 6px;
    background: url("../../src/asset_shepherd/static/asset-shepherd-thinking.png") 0 0 / 200% 200% no-repeat;
    image-rendering: pixelated; }
  .name { margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -1px; }
  .accent { width: 36px; height: 3px; margin: 14px auto 0; background: #82cbb7; border-radius: 2px; }
</style>
<div class="mascot" role="img" aria-label="Asset Shepherd mascot"></div>
<h1 class="name">Asset Shepherd</h1>
<div class="accent"></div>
</html>
