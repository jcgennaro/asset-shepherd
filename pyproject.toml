[project]
name = "asset-shepherd"
version = "0.1.0"
description = "Autonomous 3D-asset intake, inspection, repair-planning, and verification"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aws-bedrock-token-generator>=1.0.0",
    "boto3>=1.33.0",
    "botocore[crt]>=1.33.0",
    "fastapi>=0.141.1",
    "google-genai>=1.67.0,<3.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "meshoptimizer==0.2.30a0",
    "numpy>=2.5.2",
    "openai>=2.0.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pygltflib>=1.16.5",
    "python-multipart>=0.0.32",
    "strands-agents>=1.53.0",
    "trimesh>=5.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
asset-shepherd = "asset_shepherd.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime]>=1.33.0",
    "httpx2>=2.12.0",
    "jsonschema>=4.26.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "live: opt-in integration test that may invoke a configured paid model provider",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "RUF", "UP"]
ignore = ["D203", "D213"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
